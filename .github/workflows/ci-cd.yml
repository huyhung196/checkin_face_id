name: CI/CD Pipeline - Face ID AI Checkin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─── 1. BUILD & TEST FRONTEND ───
  build-frontend:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend (Vite Production Bundle)
        run: |
          cd frontend
          npm run build

      - name: Upload Built Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 2

  # ─── 2. TEST & VERIFY BACKEND ───
  test-backend:
    name: Test & Verify Backend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Frontend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Smoke & Health Test
        run: |
          cd backend
          python -c "from main import app; print('✓ Backend FastAPI & Database initialization verified!')"

  # ─── 3. AUTO DEPLOY HOOK (NẾU CÓ CẤU HÌNH RENDER/CLOUD HOOK) ───
  deploy:
    name: Trigger Cloud Deployment
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Deploy Webhook (Render / Cloud Server)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Found Deploy Webhook! Triggering automated deployment..."
            curl -fsSL -X POST "$DEPLOY_HOOK"
            echo "✓ Deployment triggered successfully!"
          else
            echo "ℹ No RENDER_DEPLOY_HOOK_URL secret found. Skipping external webhook."
            echo "ℹ Note: If using Render Git Auto-Deploy, Render will automatically build and deploy directly from GitHub."
          fi
